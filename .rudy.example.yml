concurrents: 4
filepath: /tmp/path/to/payload-file
interval: 10s
payload-size: 1MB
tor: socks5://tor_endpoint
method: PATCH
headers:
  - ContentType:application/json
  - Accept:text/html
url: http://domain.com
# protocol: http1 | http2 | h2c
protocol: http1
throttle: 15ms
# skip TLS verify for lab/self-signed targets (http2)
insecure: false
